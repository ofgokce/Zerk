<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" id="zerk-logo">
  <style>
    /* The artwork draws in `currentColor`, so it takes the colour of whatever it
       sits in. That works when the file is inlined into a page. It does not when
       the file is loaded as an image, the way a README loads it: there the SVG is
       its own document and nothing sets `color`, so `currentColor` falls back to
       the initial value of that property.

       Both schemes are stated rather than one, because that initial value is
       `canvastext` — a system colour, whose resolution depends on the colour
       scheme the renderer decides this document has. Leaning on it would make
       the light case correct by accident.

       Scoped by id rather than to `svg` or `:root`, so inlining this file cannot
       restyle anything else on the page. */
    #zerk-logo { color: #1c1c1e; }

    @media (prefers-color-scheme: dark) {
      #zerk-logo { color: #f2f2f7; }
    }
  </style>
  <defs>
    <!-- Mask to create a clean cutout halo where the Z bars meet the syringe -->
    <mask id="syringe-mask">
      <rect width="500" height="500" fill="white" />
      <g transform="rotate(45 250 250)" fill="black" stroke="black" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
        <!-- Masking Silhouettes -->
        <circle cx="250" cy="55" r="22"/>
        <circle cx="205" cy="125" r="20"/>
        <circle cx="295" cy="125" r="20"/>
        <rect x="210" y="145" width="80" height="15"/>
        <rect x="220" y="160" width="60" height="160"/>
        <rect x="235" y="320" width="30" height="10"/>
        <path d="M 240 330 L 260 330 L 255 360 L 245 360 Z"/>
        <line x1="250" y1="360" x2="250" y2="470" stroke-width="18"/>
        <line x1="250" y1="77" x2="250" y2="110" stroke-width="38"/>
      </g>
    </mask>
  </defs>

  <!-- BACKGROUND: Transparent -->

  <!-- HORIZONTAL Z BARS -->
  <g mask="url(#syringe-mask)">
    <!-- Top Bar -->
    <path d="M 120 125 L 380 125" stroke="currentColor" stroke-width="32" stroke-linecap="square" />
    <!-- Bottom Bar -->
    <path d="M 120 375 L 380 375" stroke="currentColor" stroke-width="32" stroke-linecap="square" />
  </g>

  <!-- VINTAGE SYRINGE (The Z Diagonal) -->
  <g transform="rotate(45 250 250)">
    
    <!-- NEEDLE & HUB -->
    <path d="M 247 360 L 247 452.4 L 253 446.4 L 253 360 Z" fill="currentColor" stroke="none"/>
    <path d="M 240 330 L 260 330 L 255 360 L 245 360 Z" fill="none" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/>
    <rect x="235" y="320" width="30" height="10" fill="none" stroke="currentColor" stroke-width="8" rx="2"/>

    <!-- MAIN BARREL -->
    <rect x="220" y="170" width="60" height="150" fill="none" stroke="currentColor" stroke-width="10" rx="8"/>
    <!-- High-Contrast Glass Reflection (Solid fill for line-art style) -->
    <line x1="270" y1="320" x2="270" y2="250" stroke="currentColor" stroke-width="4"/>
    <line x1="270" y1="242" x2="270" y2="170" stroke="currentColor" stroke-width="4"/>

    <!-- MEASUREMENT TICKS (Graduations) -->
    <line x1="220" y1="180" x2="235" y2="180" stroke="currentColor" stroke-width="4"/>
    <line x1="220" y1="200" x2="230" y2="200" stroke="currentColor" stroke-width="4"/>
    <line x1="220" y1="220" x2="240" y2="220" stroke="currentColor" stroke-width="5"/>
    <line x1="220" y1="240" x2="230" y2="240" stroke="currentColor" stroke-width="4"/>
    <line x1="220" y1="260" x2="235" y2="260" stroke="currentColor" stroke-width="4"/>
    <line x1="220" y1="280" x2="230" y2="280" stroke="currentColor" stroke-width="4"/>
    <line x1="220" y1="300" x2="240" y2="300" stroke="currentColor" stroke-width="5"/>

    <!-- INTERNAL PLUNGER -->
    <!-- Plunger Rod -->
    <line x1="250" y1="110" x2="250" y2="240" stroke="currentColor" stroke-width="12"/>
    <!-- Plunger Stopper Head -->
    <rect x="220" y="240" width="60" height="20" fill="currentColor"/>
    <!-- Stopper Highlight Groove (Using page background color to punch through) -->
    <line x1="225" y1="246" x2="275" y2="246" stroke="#FFFFFF" stroke-width="3"/>

    <!-- BARREL TOP / FLANGE (Vintage curved metal base) -->
    <path d="M 210 160 Q 250 172 290 160 L 290 145 L 210 145 Z" fill="none" stroke="currentColor" stroke-width="10" stroke-linejoin="round"/>

    <!-- VINTAGE FINGER RINGS (Side grips) -->
    <!-- Left Ring -->
    <circle cx="205" cy="125" r="20" fill="none" stroke="currentColor" stroke-width="10"/>
    <!-- Right Ring -->
    <circle cx="295" cy="125" r="20" fill="none" stroke="currentColor" stroke-width="10"/>

    <!-- THUMB RING (Top grip) -->
    <circle cx="250" cy="55" r="22" fill="none" stroke="currentColor" stroke-width="10"/>

    <!-- PLUNGER SHAFT (Connects thumb ring to rod) -->
    <rect x="242" y="77" width="16" height="33" fill="none" stroke="currentColor" stroke-width="8"/>
    <line x1="242" y1="90" x2="258" y2="90" stroke="currentColor" stroke-width="4"/>
    <line x1="242" y1="100" x2="258" y2="100" stroke="currentColor" stroke-width="4"/>

  </g>
</svg>
